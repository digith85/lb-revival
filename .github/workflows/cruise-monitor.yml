name: Cruise Fare Monitor

on:
  schedule:
    # Stündlich (GitHub Actions UTC — entspricht z.B. 07–23 Uhr CEST wenn gewünscht)
    - cron: "0 * * * *"
  workflow_dispatch:
    # Manueller Start per Knopfdruck in GitHub (auch vom Handy-Browser möglich)
    inputs:
      discover:
        description: "API-Debug-Modus (alle Endpoints loggen)"
        required: false
        default: "false"
        type: boolean

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cruise-search/requirements.txt

      - name: Abhängigkeiten installieren
        run: |
          pip install -r cruise-search/requirements.txt
          playwright install chromium --with-deps

      - name: Config mit Secrets befüllen
        working-directory: cruise-search
        env:
          NOTIFY_EMAIL_TO:   ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          SMTP_HOST:         ${{ secrets.SMTP_HOST }}
          SMTP_PORT:         ${{ secrets.SMTP_PORT }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASS:         ${{ secrets.SMTP_PASS }}
          MAX_TOTAL_EUR:     ${{ vars.MAX_TOTAL_EUR }}
        run: |
          python3 - <<'EOF'
          import json, os

          cfg = json.load(open("config.json"))

          # E-Mail aus Secrets befüllen
          email = cfg["notification"]["email"]
          email["enabled"]   = bool(os.getenv("NOTIFY_EMAIL_TO"))
          email["to"]        = os.getenv("NOTIFY_EMAIL_TO", "")
          email["from"]      = os.getenv("NOTIFY_EMAIL_FROM", "")
          email["smtp_host"] = os.getenv("SMTP_HOST", "smtp.gmail.com")
          email["smtp_port"] = int(os.getenv("SMTP_PORT", "587"))
          email["username"]  = os.getenv("SMTP_USER", "")
          email["password"]  = os.getenv("SMTP_PASS", "")

          # Optionales Budget-Limit
          if os.getenv("MAX_TOTAL_EUR"):
              cfg["budget"]["max_total_eur"] = float(os.getenv("MAX_TOTAL_EUR"))

          json.dump(cfg, open("config.json", "w"), ensure_ascii=False, indent=2)
          print("Config aktualisiert.")
          EOF

      - name: Kreuzfahrt-Suche starten
        working-directory: cruise-search
        run: |
          ARGS="--once"
          if [ "${{ github.event.inputs.discover }}" = "true" ]; then
            ARGS="$ARGS --discover"
          fi
          python main.py $ARGS

      - name: Ergebnisse als Artefakt speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cruise-results-${{ github.run_number }}
          path: |
            cruise-search/found_fares.json
            cruise-search/cruise_search.log
          retention-days: 30
          if-no-files-found: ignore
